<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welcome to My Website</title>
  <style>
    body {
      margin: 0;
      font-family: 'Cambria', serif;
      font-size: 14px;
      background: lightblue;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      box-sizing: border-box;
    }

    .main {
      text-align: center;
      background: #f7fcff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
      max-width: 700px;
      width: 100%;
    }

    h1 {
      color: #0d47a1;
      font-size: 24px;
      margin-bottom: 10px;
    }

    p {
      line-height: 1.6;
      color: #123;
    }

    button {
      background: blue;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-family: 'Cambria', serif;
      font-size: 14px;
      margin-top: 8px;
    }

    .marquee {
      margin-top: 16px;
      background: #1e88e5;
      color: white;
      padding: 8px 0;
      overflow: hidden;
      white-space: nowrap;
      border-radius: 6px;
    }

    .marquee span {
      display: inline-block;
      padding-left: 100%;
      animation: scroll 10s linear infinite;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-top: 18px;
    }

    .box {
      background: #eaf6ff;
      border: 1px solid #80bde8;
      padding: 12px;
      border-radius: 8px;
    }

    @keyframes scroll {
      from { transform: translateX(0); }
      to { transform: translateX(-100%); }
    }
  </style>
</head>
<body>
  <div class="main">
    <h1>Welcome to My Website</h1>
    <p>This is a simple page with light blue background, blue button, centered content, scrolling text, Cambria font, 14 size, and grid box layout.</p>
    <button>Click Here</button>

    <div class="marquee">
      <span>Scrolling text on the web page with blue colors and Cambria font.</span>
    </div>

    <div class="grid">
      <div class="box">
        <h3>Section 1</h3>
        <p>Simple blue design.</p>
      </div>
      <div class="box">
        <h3>Section 2</h3>
        <p>Grid box layout.</p>
      </div>
    </div>
  </div>
</body>
</html>
